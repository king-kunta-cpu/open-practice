<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Practice — Quote lab</title><style>body{max-width:650px;padding:24px;margin:30px auto;background:#142526;color:#ede2c9;font:17px/1.8 Arial}h1{font-weight:900}label{display:block}input,button{font:inherit;padding:12px;margin:8px 0}input{max-width:100%;box-sizing:border-box}button{background:#cfaa6d;color:#142526;border:0}#result{border-left:3px solid #cfaa6d;padding-left:15px}</style><h1>Quote calculation lab</h1><p>Fictional estimates only. No tax, invoicing or payment processing. Original practice material, CC BY 4.0.</p><form id="form"><label for="quantity">Quantity</label><input id="quantity" inputmode="decimal" required><label for="price">Unit price</label><input id="price" inputmode="decimal" required><br><button>Calculate</button></form><p id="result" role="status"></p><script>function calculateQuote(quantity,price){
 if(String(quantity).trim()===''||String(price).trim()==='')throw new Error('Quantity and price are required.');
 const q=Number(quantity),p=Number(price);
 if(!Number.isFinite(q)||!Number.isFinite(p)||q<0||p<0)throw new Error('Use finite, non-negative numbers.');
 const total=q*p;if(!Number.isFinite(total))throw new Error('Result is too large.');return total;
}
document.getElementById('form').onsubmit=e=>{e.preventDefault();try{const total=calculateQuote(document.getElementById('quantity').value,document.getElementById('price').value);document.getElementById('result').textContent='Estimate: '+total.toFixed(2)}catch(err){document.getElementById('result').textContent=err.message}};</script></html>
