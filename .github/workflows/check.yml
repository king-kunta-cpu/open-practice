name: Check platform
on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:assets
      - run: git diff --exit-code
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r curriculum/expansion/requirements-test.txt
      - run: python scripts/check-expansion.py
