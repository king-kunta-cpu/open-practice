<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote calculator · Open Practice starter</title><style>body{max-width:600px;margin:40px auto;padding:20px;font:18px/1.7 Arial;color:#193a31;background:#f6f5ee}label{display:block}input,button{font:inherit;padding:10px;margin-bottom:15px}button{background:#193a31;color:white;border:0}</style><h1>Quote calculator</h1><p>Original Open Practice starter · CC BY 4.0. Fictional quotes only; no payments.</p><form id="form"><label for="quantity">Quantity</label><input id="quantity" type="number" min="0" step="any" required><label for="price">Unit price</label><input id="price" type="number" min="0" step="any" required><br><button>Calculate</button></form><p id="result" role="status"></p><script>document.getElementById("form").onsubmit=e=>{e.preventDefault();const q=Number(document.getElementById("quantity").value),p=Number(document.getElementById("price").value);document.getElementById("result").textContent=Number.isFinite(q)&&Number.isFinite(p)&&q>=0&&p>=0?"Quote: "+(q*p).toFixed(2):"Enter valid non-negative numbers."}</script></html>
